# Portainer-Stack; bestehende Daten vor Update sichern.
services:
  dhcp-admin:
    image: ghcr.io/jbkunama1/hai.peedhcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8095}:8080"
    environment:
      PIHOLE_URL: ${PIHOLE_URL:?PIHOLE_URL setzen}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:?PIHOLE_PASSWORD setzen}
      ADMIN_PIN: ${ADMIN_PIN:?ADMIN_PIN setzen}
      SECRET_KEY: ${SECRET_KEY:?Mindestens 32 zufaellige Zeichen setzen}
      PIHOLE_TLS_INSECURE: ${PIHOLE_TLS_INSECURE:-false}
      PIHOLE_CA_BUNDLE: ${PIHOLE_CA_BUNDLE:-}
      REQUIRE_READ_AUTH: ${REQUIRE_READ_AUTH:-false}
      ALLOW_UNAUTHENTICATED_WRITES: "false"
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Europe/Berlin
    volumes:
      - ${DATA_SOURCE:-peedhcp_data}:/app/data
      # Eigene CA optional zusaetzlich einbinden, siehe README.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/api/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  peedhcp_data:
