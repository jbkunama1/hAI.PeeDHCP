# Portainer: Variablen unter Environment variables setzen.
# Bestehende ./data vor Umstellung sichern; siehe docs/PORTAINER.md.
services:
  dhcp-admin:
    image: ghcr.io/jbkunama1/hai.peedhcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8095}:8080"
    environment:
      PIHOLE_URL: ${PIHOLE_URL:?PIHOLE_URL setzen}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:?PIHOLE_PASSWORD setzen}
      ADMIN_PIN: ${ADMIN_PIN:?ADMIN_PIN setzen}
      SECRET_KEY: ${SECRET_KEY:?Unabhaengigen langen SECRET_KEY setzen}
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Europe/Berlin
    volumes:
      - ${DATA_SOURCE:-peedhcp_data}:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  peedhcp_data:
