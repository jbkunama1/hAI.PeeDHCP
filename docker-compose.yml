name: hai-peedhcp

services:
  dhcp-admin:
    image: ${HAI_PEEDHCP_IMAGE:-ghcr.io/jbkunama1/hai.peedhcp}:${HAI_PEEDHCP_TAG:-latest}
    container_name: dhcp-admin
    restart: unless-stopped
    ports:
      - "${HAI_PEEDHCP_PORT:-8095}:8080"
    environment:
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      ADMIN_PIN: ${ADMIN_PIN:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOW_UNAUTHENTICATED_WRITES: ${ALLOW_UNAUTHENTICATED_WRITES:-false}
      PIHOLE_TLS_INSECURE: ${PIHOLE_TLS_INSECURE:-false}
      PIHOLE_CA_BUNDLE: ${PIHOLE_CA_BUNDLE:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/Berlin}
      DATA_DIR: /app/data
    volumes:
      - hai_peedhcp_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=false"

volumes:
  hai_peedhcp_data:
    name: hai_peedhcp_data
